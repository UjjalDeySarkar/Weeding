# Lint and build every change, then deploy it to Vercel:
#   push to main        → production (https://ujjal-weds-rupsha.vercel.app)
#   pull request        → preview, with the link posted on the PR
#   manual run (Actions → Deploy → Run workflow) → production from main, preview from any other branch
#
# Needs one repository secret: VERCEL_TOKEN, created at vercel.com/account/settings/tokens by a member of the
# heka4 team, with its scope set to heka4.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # explicit bash turns on pipefail, so a failing command in a pipe fails the step
    shell: bash

env:
  # From .vercel/project.json — identifiers, not credentials
  VERCEL_ORG_ID: team_I0O4WS7Cjl4UOHSaeiUDepzr
  VERCEL_PROJECT_ID: prj_GpD6NqivGIWfq04N0AEJGgIxobg6
  VERCEL_CLI: vercel@59.20.0
  NODE_VERSION: 24

jobs:
  check:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    name: Deploy to Vercel
    needs: check
    # Secrets aren't shared with pull requests from forks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TARGET: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      PROD_FLAG: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && '--prod' || '' }}
    environment:
      name: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Vercel CLI
        run: |
          npm install --global "$VERCEL_CLI"
          # vc = vercel with the token attached (spaces or line breaks pasted into the secret are ignored)
          cat > "$RUNNER_TEMP/vc" <<'SCRIPT'
          #!/usr/bin/env bash
          exec vercel "$@" --token="$(printf '%s' "$VERCEL_TOKEN" | tr -d '[:space:]')"
          SCRIPT
          # explain <what> <logs…> = turn a Vercel CLI failure into a readable error on the run page
          cat > "$RUNNER_TEMP/explain" <<'SCRIPT'
          #!/usr/bin/env bash
          what=$1; shift
          msg=$(cat "$@" 2>/dev/null | grep -m1 -E '^Error' || true)
          [ -n "$msg" ] || msg=$(cat "$@" 2>/dev/null | grep -m1 -oE '"message": *"[^"]*"' | sed -E 's/"message": *"(.*)"/\1/' || true)
          echo "::error::$what failed: ${msg:-see the log above}"
          exit 1
          SCRIPT
          chmod +x "$RUNNER_TEMP/vc" "$RUNNER_TEMP/explain"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check the Vercel token
        run: |
          if [ -z "$(printf '%s' "$VERCEL_TOKEN" | tr -d '[:space:]')" ]; then
            echo "::error::Add a VERCEL_TOKEN repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          vc whoami > whoami.log 2>&1 || { cat whoami.log; explain "Vercel token check" whoami.log; }
          echo "::notice::VERCEL_TOKEN belongs to Vercel user $(grep -vE '^(Vercel CLI|<|[[:space:]]*$)' whoami.log | tail -n 1)"

      - name: Pull project settings
        run: vc pull --yes --environment="$TARGET" > pull.log 2>&1 || { cat pull.log; explain "vercel pull" pull.log; }

      - name: Build
        run: vc build $PROD_FLAG 2>&1 | tee build.log || explain "vercel build" build.log

      - name: Deploy
        id: deploy
        run: |
          vc deploy --prebuilt $PROD_FLAG --format json > deployment.json 2> deploy.log \
            || { cat deploy.log deployment.json; explain "vercel deploy" deploy.log deployment.json; }
          url=$(node -e '
            const text = require("node:fs").readFileSync("deployment.json", "utf8")
            const out = JSON.parse(text.slice(text.indexOf("{")))
            const url = out.deployment?.url ?? out.url
            console.log(url.startsWith("http") ? url : `https://${url}`)
          ')
          if [ "$TARGET" = "production" ]; then url="https://ujjal-weds-rupsha.vercel.app"; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed to $TARGET: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Post the preview link on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- vercel-preview -->'
            const body = `${marker}\n🪷 **Preview is ready:** ${process.env.PREVIEW_URL}\n\n<sub>Commit ${context.sha.slice(0, 7)}</sub>`
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const existing = comments.find((c) => c.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
